# Statisk demo på GitHub Pages: henter AIS og nyheter, lager et øyeblikksbilde
# av oversikten og publiserer forsiden og oversikten. Kjører hver time.
name: GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter
        run: |
          pip install -r requirements.txt
          # Språkmodellen hentes fra Hugging Face. GitHub Releases, som spacy download
          # bruker, svarer ofte med 504 fra Actions og er bare reserve.
          for i in 1 2 3; do
            # Hugging Face kaller filen «-any-», som pip ikke godtar som versjon
            curl -fsSL -o /tmp/nb_core_news_md-3.8.0-py3-none-any.whl \
              https://huggingface.co/spacy/nb_core_news_md/resolve/main/nb_core_news_md-any-py3-none-any.whl \
              && pip install /tmp/nb_core_news_md-3.8.0-py3-none-any.whl && break
            python -m spacy download nb_core_news_md && break
            echo "Nedlasting feilet, prøver igjen om $((i * 20)) sek"; sleep $((i * 20))
          done
          python -c "import spacy; spacy.load('nb_core_news_md')"

      # Nyhetsbasen tas vare på mellom kjøringene, slik at grafen dekker 72 timer
      # og steder ikke må slås opp i Kartverket på nytt hver gang
      - uses: actions/cache@v4
        with:
          path: data/nyheter.sqlite
          key: nyheter-${{ github.run_id }}
          restore-keys: nyheter-

      # Kystverkets TCP-strøm svarer ikke fra GitHub, så AIS hentes fra BarentsWatch
      # når repo-hemmelighetene finnes. Uten dem prøves TCP-strømmen.
      - name: Lag øyeblikksbilde
        env:
          BARENTSWATCH_CLIENT_ID: ${{ secrets.BARENTSWATCH_CLIENT_ID }}
          BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}
        run: python -m scripts.snapshot --ais-sekunder 240

      - name: Bygg nettsiden
        run: python -m scripts.build_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
